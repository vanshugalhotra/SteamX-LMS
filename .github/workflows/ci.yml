name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: steamx_local
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: steamx_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamx_local -d steamx_lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://steamx_local:local_dev_password@localhost:5432/steamx_lms_test
      DB_POOL_MAX: 10
      DB_CONNECTION_TIMEOUT_MS: 5000
      CORS_ORIGINS: http://localhost:5173
      AUTH_JWT_SECRET: steamx-ci-only-test-signing-key-not-for-production-00000000
      AWS_REGION: ap-south-1
      S3_BUCKET: test-bucket
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steamx/backend prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:backend
      - run: pnpm test:frontend
      - run: pnpm build
